services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zcord-postgres-dev
    environment:
      POSTGRES_DB: zcord
      POSTGRES_USER: nikdimer
      POSTGRES_PASSWORD: technocraft2000
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    networks:
      - zcord-network
    restart: unless-stopped
    # Podman-specific security options
    security_opt:
      - label=disable

  # Go Backend Server (Development)
  backend:
    image: golang:1.22.1-alpine
    container_name: zcord-backend-dev
    working_dir: /app
    environment:
      DATABASE_URL: postgres://nikdimer:technocraft2000@postgres:5432/zcord?sslmode=disable
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app:Z
      - ./server/uploads:/root/uploads:Z
    depends_on:
      - postgres
    networks:
      - zcord-network
    restart: unless-stopped
    command: ["sh", "-c", "go mod download && go run ."]
    # Podman-specific security options
    security_opt:
      - label=disable

  # Next.js Frontend (Development)
  frontend:
    image: node:18-alpine
    container_name: zcord-frontend-dev
    working_dir: /app
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # File watching can be unreliable on Windows + (Podman/Docker) bind mounts.
      # Force polling so Next.js hot reload picks up changes consistently.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app:Z
      - /app/node_modules
      - /app/.next
      - /app/.turbo
    depends_on:
      - backend
    networks:
      - zcord-network
    restart: unless-stopped
    command: ["sh", "-c", "npm install && npm run dev"]
    # Podman-specific security options
    security_opt:
      - label=disable

volumes:
  postgres_data:

networks:
  zcord-network:
    driver: bridge
