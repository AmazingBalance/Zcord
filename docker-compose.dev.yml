services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zcord-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zcord}
      POSTGRES_USER: ${POSTGRES_USER:-zcord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zcord-network
    restart: unless-stopped

  # Go Backend Server (Development)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: zcord-backend-dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-zcord}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-zcord}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./server:/app
      - ./server/uploads:/root/uploads
    depends_on:
      - postgres
    networks:
      - zcord-network
    restart: unless-stopped
    command: ["go", "run", ".", "--watch"]

  # Next.js Frontend (Development)
  frontend:
    image: node:18-alpine
    container_name: zcord-frontend-dev
    working_dir: /app
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/.turbo
    depends_on:
      - backend
    networks:
      - zcord-network
    restart: unless-stopped
    command: ["npm", "run", "dev"]

networks:
  zcord-network:
    driver: bridge

volumes:
  postgres_data:
