services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zcord-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zcord}
      POSTGRES_USER: ${POSTGRES_USER:-nikdimer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-technocraft2000}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:Z,ro
    networks:
      - zcord-network
    restart: unless-stopped
    # Podman-specific security options
    security_opt:
      - label=disable

  # Go Backend Server
  backend:
    build:
      context: ./server
      dockerfile: Containerfile
    container_name: zcord-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nikdimer}:${POSTGRES_PASSWORD:-technocraft2000}@postgres:5432/${POSTGRES_DB:-zcord}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      BOOTSTRAP_ROOT_EMAIL: ${BOOTSTRAP_ROOT_EMAIL:-nikdm.gm@gmail.com}
      BOOTSTRAP_ROOT_PASSWORD: ${BOOTSTRAP_ROOT_PASSWORD:-}
      BOOTSTRAP_NIKDIMER_EMAIL: ${BOOTSTRAP_NIKDIMER_EMAIL:-nikdimer@yandex.ru}
      BOOTSTRAP_NIKDIMER_PASSWORD: ${BOOTSTRAP_NIKDIMER_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/root/uploads:Z
    depends_on:
      - postgres
    networks:
      - zcord-network
    restart: unless-stopped
    # Podman-specific security options
    security_opt:
      - label=disable

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Containerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: zcord-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - zcord-network
    restart: unless-stopped
    # Podman-specific security options
    security_opt:
      - label=disable

volumes:
  postgres_data:
  uploads_data:

networks:
  zcord-network:
    driver: bridge
