services:
  postgres:
    image: postgres:15-alpine
    container_name: zcord-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zcord}
      POSTGRES_USER: ${POSTGRES_USER:-zcord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - zcord-network
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: zcord-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-zcord}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-zcord}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PUBLIC_API_URL: https://${ZCORD_DOMAIN}
      PUBLIC_WEB_URL: https://${ZCORD_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${ZCORD_DOMAIN}
      BOOTSTRAP_ROOT_EMAIL: ${BOOTSTRAP_ROOT_EMAIL:-}
      BOOTSTRAP_ROOT_PASSWORD: ${BOOTSTRAP_ROOT_PASSWORD:-}
      BOOTSTRAP_NIKDIMER_EMAIL: ${BOOTSTRAP_NIKDIMER_EMAIL:-}
      BOOTSTRAP_NIKDIMER_PASSWORD: ${BOOTSTRAP_NIKDIMER_PASSWORD:-}
    volumes:
      - uploads_data:/root/uploads
    depends_on:
      - postgres
    networks:
      - zcord-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${ZCORD_DOMAIN}
    container_name: zcord-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${ZCORD_DOMAIN}
    depends_on:
      - backend
    networks:
      - zcord-network
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: zcord-caddy
    environment:
      ZCORD_DOMAIN: ${ZCORD_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - zcord-network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  zcord-network:
    driver: bridge

